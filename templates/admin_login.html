<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login | Glow & Grace Salon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    body { background: linear-gradient(135deg, #faf6f0 0%, #f0e2e5 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .login-wrapper { width: 100%; max-width: 440px; padding: 1rem; }
    .login-card { background: #fff; border-radius: 20px; padding: 3rem 2.5rem; box-shadow: 0 20px 60px rgba(31,29,27,0.12); border: 1px solid rgba(197,160,89,0.3); }
    .login-logo { font-family: 'Cormorant Garamond', serif; font-size: 2rem; font-weight: 700; color: #1f1d1b; text-align: center; margin-bottom: 0.25rem; }
    .login-logo span { color: #c5a059; font-style: italic; }
    .login-subtitle { text-align: center; font-size: 0.8rem; letter-spacing: 0.2em; text-transform: uppercase; color: #857e78; margin-bottom: 2.5rem; font-weight: 600; }
    .login-error { background: #fdf0f1; border: 1px solid #e2b3b8; border-radius: 10px; padding: 0.9rem 1.2rem; color: #a45860; font-size: 0.9rem; margin-bottom: 1.5rem; display: flex; gap: 0.5rem; align-items: center; }
    .admin-badge { display: inline-block; background: rgba(197,160,89,0.1); border: 1px solid rgba(197,160,89,0.4); border-radius: 20px; padding: 0.3rem 0.9rem; font-size: 0.75rem; letter-spacing: 0.15em; text-transform: uppercase; color: #c5a059; font-weight: 700; text-align: center; width: 100%; margin-bottom: 2rem; }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-logo">Glow <span>&</span> Grace</div>
      <div class="login-subtitle">Salon Management</div>
      <div class="admin-badge">🔒 Admin Access Only</div>

      {% if error %}
      <div class="login-error">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        {{ error }}
      </div>
      {% endif %}

      {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
      <div class="flash-message {{ category }}" style="margin-bottom:1rem;"><p>{{ message }}</p></div>
      {% endfor %}
      {% endwith %}

      <form method="POST">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="Admin username" autocomplete="username" autofocus required />
        </div>
        <div class="form-group" style="margin-top:1rem;">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Admin password" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block" style="margin-top:1.75rem;">
          Sign In to Dashboard
          <svg class="btn-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
      </form>

      <div style="text-align:center; margin-top:1.5rem;">
        <a href="{{ url_for('index') }}" style="font-size:0.85rem; color: var(--color-charcoal-400);">← Back to Website</a>
      </div>
    </div>
  </div>
</body>
</html>
